<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atualizações de Medição — SIGOM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--az:#1e4e79;--az2:#2e75b6;--bg:#edf3f8;--card:#fff;--txt:#18324a;--gold:#f2c94c}
*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--txt)}
header{background:linear-gradient(90deg,#163f67,#2e75b6);color:white;padding:18px 26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:2px 0 4px;font-size:25px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}
button.white{background:#fff;color:var(--az)}button.blue{background:var(--az2);color:#fff}button.gray{background:#dce5ed;color:#234}
main{max-width:1500px;margin:auto;padding:16px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px #0001;border-left:5px solid var(--az2)}
.kpi strong{display:block;font-size:24px;color:var(--az);margin-top:4px}.filters{display:flex;gap:8px;flex-wrap:wrap;background:#fff;padding:12px;border-radius:12px;margin-bottom:12px}
.filters input,.filters select{padding:8px;border:1px solid #c8d5e2;border-radius:8px;min-width:150px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px #0001}.status{font-size:12px;margin:8px 0;color:#5c7185}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--az);color:white;position:sticky;top:0;padding:8px;text-align:left}
td{padding:8px;border-bottom:1px solid #e0e8ef}tr.unread td{background:#fff7d1}.tablewrap{max-height:650px;overflow:auto}
.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-weight:800;font-size:10px}.pill.up{background:#dcf4d2;color:#255d20}.pill.read{background:#e8edf2;color:#53606c}
.badge{display:inline-flex;min-width:22px;height:22px;align-items:center;justify-content:center;border-radius:999px;background:#c00000;color:#fff;font-size:11px;font-weight:800}
@media(max-width:800px){table{min-width:1000px}.tablewrap{overflow:auto}}
</style></head>
<body>
<header><div class="top">
<div><div style="font-size:11px;font-weight:800">SIGOM 2026 · FASE 12.34.2</div><h1>🔔 Atualizações de Medição <span id="headerUnread" class="badge">0</span></h1><div>Avanços físicos detectados automaticamente nas atualizações das obras.</div></div>
<div class="actions"><button class="white" onclick="location.href='/app.html'">Dashboard</button><button class="white" onclick="location.href='/app/objetivos.html'">Objetivos e Metas</button><button class="white" onclick="location.href='/app/visao-diretor.html'">Visão do Diretor</button><button class="white" id="refresh">Atualizar</button></div>
</div></header>
<main>
<div class="kpis">
<div class="kpi">Alertas registrados<strong id="kTotal">0</strong></div>
<div class="kpi">Não lidos<strong id="kUnread">0</strong></div>
<div class="kpi">Obras com avanço<strong id="kWorks">0</strong></div>
<div class="kpi">Avanço acumulado<strong id="kDelta">0,00 p.p.</strong></div>
</div>
<div class="filters">
<input id="q" placeholder="Buscar OPUS, contrato ou obra">
<select id="rm"><option value="">RM — todas</option></select>
<select id="grupo"><option value="">Grupo — todos</option></select>
<select id="read"><option value="">Leitura — todas</option><option value="0">Não lidos</option><option value="1">Lidos</option></select>
<button class="gray" id="clear">Limpar</button>
<button class="blue" id="markAll">Marcar filtrados como lidos</button>
</div>
<div id="status" class="status">Inicializando...</div>
<div class="card"><div class="tablewrap"><table>
<thead><tr><th>Data</th><th>Nº OPUS</th><th>Contrato</th><th>Obra</th><th>RM</th><th>Grupo</th><th>% anterior</th><th>% atual</th><th>Avanço</th><th>Situação</th><th>Ação</th></tr></thead>
<tbody id="body"></tbody></table></div></div>
</main>
<script src="/config.js"></script>
<script>
const cfg=window.SIGOM_CONFIG,db=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);
let alerts=[],works=new Map,groupsByWork=new Map;
const n=v=>Number.isFinite(Number(v))?Number(v):0,fmt=v=>n(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function auth(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='/';throw Error('Sessão não encontrada')}}
async function load(){
 $('status').textContent='Carregando alertas...';await auth();
 let {data,error}=await db.from('alertas_medicao').select('*').order('criado_em',{ascending:false}).limit(2000);if(error)throw error;alerts=data||[];
 const opus=[...new Set(alerts.map(a=>a.opus).filter(Boolean))];works.clear();groupsByWork.clear();
 if(opus.length){
   let {data:o}=await db.from('obras').select('id,opus,contrato,nome_obra,descricao,rm,om_beneficiada').in('opus',opus);
   (o||[]).forEach(x=>works.set(String(x.opus),x));
   const ids=(o||[]).map(x=>x.id).filter(Boolean);
   if(ids.length){
     const {data:go}=await db.from('grupo_obras').select('obra_id,grupo_id').in('obra_id',ids);
     const gids=[...new Set((go||[]).map(x=>x.grupo_id).filter(Boolean))];
     let gmap=new Map;
     if(gids.length){const {data:gs}=await db.from('grupos').select('id,nome').in('id',gids);(gs||[]).forEach(g=>gmap.set(g.id,g.nome))}
     (go||[]).forEach(x=>{const arr=groupsByWork.get(x.obra_id)||[];const nm=gmap.get(x.grupo_id);if(nm)arr.push(nm);groupsByWork.set(x.obra_id,arr)})
   }
 }
 fillFilters();render();$('status').textContent='Atualizado em '+new Date().toLocaleString('pt-BR');
}
function fillFilters(){
 const rms=[...new Set([...works.values()].map(x=>x.rm).filter(Boolean))].sort();
 $('rm').innerHTML='<option value="">RM — todas</option>'+rms.map(x=>`<option>${esc(x)}</option>`).join('');
 const gs=[...new Set([...groupsByWork.values()].flat())].sort();
 $('grupo').innerHTML='<option value="">Grupo — todos</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join('');
}
function filtered(){
 const q=$('q').value.trim().toLowerCase(),rm=$('rm').value,gr=$('grupo').value,rd=$('read').value;
 return alerts.filter(a=>{const o=works.get(String(a.opus))||{},groups=groupsByWork.get(o.id)||[],hay=[a.opus,a.contrato,o.nome_obra,o.descricao,o.om_beneficiada,...groups].join(' ').toLowerCase();
 return (!q||hay.includes(q))&&(!rm||o.rm===rm)&&(!gr||groups.includes(gr))&&(!rd||(rd==='1')===!!a.lido)});
}
function render(){
 const a=filtered(),unique=new Set(a.map(x=>x.opus)),delta=a.reduce((s,x)=>s+n(x.variacao),0),unread=a.filter(x=>!x.lido).length;
 $('kTotal').textContent=a.length.toLocaleString('pt-BR');$('kUnread').textContent=unread.toLocaleString('pt-BR');$('headerUnread').textContent=alerts.filter(x=>!x.lido).length.toLocaleString('pt-BR');$('kWorks').textContent=unique.size.toLocaleString('pt-BR');$('kDelta').textContent=fmt(delta)+' p.p.';
 $('body').innerHTML=a.map(x=>{const o=works.get(String(x.opus))||{},name=o.nome_obra||o.descricao||'—',groups=(groupsByWork.get(o.id)||[]).join(', ')||'—';return `<tr class="${x.lido?'':'unread'}">
 <td>${new Date(x.criado_em).toLocaleString('pt-BR')}</td><td><b>${esc(x.opus)}</b></td><td>${esc(x.contrato||o.contrato||'—')}</td><td>${esc(name)}</td><td>${esc(o.rm||'—')}</td><td>${esc(groups)}</td>
 <td>${fmt(x.percentual_anterior)}%</td><td>${fmt(x.percentual_novo)}%</td><td><span class="pill up">+${fmt(x.variacao)} p.p.</span></td><td><span class="pill ${x.lido?'read':'up'}">${x.lido?'Lido':'Novo'}</span></td>
 <td><button class="gray" onclick="openWork('${esc(x.opus)}')">Abrir obra</button> ${x.lido?'':`<button class="blue" onclick="markRead('${x.id}')">Marcar como lido</button>`}</td></tr>`}).join('')||'<tr><td colspan="11">Nenhum alerta encontrado.</td></tr>';
}
async function markRead(id){const {error}=await db.from('alertas_medicao').update({lido:true,lido_em:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);const a=alerts.find(x=>x.id===id);if(a)a.lido=true;render()}
async function markAll(){const ids=filtered().filter(x=>!x.lido).map(x=>x.id);if(!ids.length)return;const {error}=await db.from('alertas_medicao').update({lido:true,lido_em:new Date().toISOString()}).in('id',ids);if(error)return alert(error.message);alerts.forEach(x=>{if(ids.includes(x.id))x.lido=true});render()}
function openWork(opus){location.href='/app.html?opus='+encodeURIComponent(opus)+'#obra'}
['q','rm','grupo','read'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));
$('refresh').onclick=()=>load().catch(e=>$('status').textContent='Erro: '+e.message);
$('clear').onclick=()=>{$('q').value='';$('rm').value='';$('grupo').value='';$('read').value='';render()};
$('markAll').onclick=markAll;load().catch(e=>$('status').textContent='Erro: '+e.message);
</script></body></html>

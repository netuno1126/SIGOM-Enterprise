<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGOM · Obras Paralisadas</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>body{font-family:Segoe UI,Arial;background:#eef3f8;color:#1a2b3c;margin:0}.top{background:#1e4e79;color:#fff;padding:12px 18px;display:flex;gap:10px;align-items:center}.top h1{font-size:18px;margin:0;flex:1}.btn{border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}.white{background:#fff;color:#1e4e79}.green{background:#70ad47;color:#fff}.wrap{padding:16px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 6px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}input,select,textarea{padding:8px;border:1px solid #c4d3e3;border-radius:8px;width:100%}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#1e4e79;color:#fff;padding:7px}td{border-bottom:1px solid #e4ecf4;padding:6px;vertical-align:top}.tag{border-radius:20px;color:#fff;font-weight:700;padding:2px 8px}.p1{background:#c00000}.p2{background:#e67e22}.p3{background:#2e75b6}.p4{background:#70ad47}</style></head><body><div class="top"><h1>🚧 SIGOM · Obras Paralisadas</h1><button class="btn white" onclick="location.href='dashboard_SIGOM.html'">↩ Dashboard</button></div><div class="wrap"><div class="card"><h3>Cadastrar obra paralisada</h3><div class="grid"><input id="opus" placeholder="Nº OPUS"><input id="contrato" placeholder="Contrato"><input id="obra" placeholder="Nome/descrição da obra"><select id="proc"><option>Processo crítico 1</option><option>Processo crítico 2</option><option>Processo crítico 3</option><option>Processo crítico 4</option></select><textarea id="obs" placeholder="Observações"></textarea><button class="btn green" onclick="add()">Adicionar</button></div></div><div class="card"><h3>Lista de obras paralisadas</h3><table><thead><tr><th>Processo</th><th>OPUS</th><th>Contrato</th><th>Obra</th><th>Observações</th><th>Ações</th></tr></thead><tbody id="tb"></tbody></table></div></div><script>const key='sigom_obras_paralisadas';let dados=[];function load(){try{dados=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){dados=[]}render()}function save(){localStorage.setItem(key,JSON.stringify(dados));render()}function add(){dados.push({opus:opus.value,contrato:contrato.value,obra:obra.value,proc:proc.value,obs:obs.value,dt:new Date().toISOString()});opus.value=contrato.value=obra.value=obs.value='';save()}function del(i){if(confirm('Excluir registro?')){dados.splice(i,1);save()}}function render(){tb.innerHTML=dados.map((d,i)=>`<tr><td><span class="tag p${(d.proc||'1').match(/\d/)?.[0]||1}">${d.proc}</span></td><td>${d.opus||''}</td><td>${d.contrato||''}</td><td>${d.obra||''}</td><td>${d.obs||''}</td><td><button onclick="del(${i})">Excluir</button></td></tr>`).join('')||'<tr><td colspan=6 style="text-align:center;color:#777">Nenhuma obra cadastrada.</td></tr>'}load()</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGOM</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="login-wrap"><section class="login-card"><div class="brand-row"><img src="/assets/logos/dom.png" alt="DOM"><img class="sigom" src="/assets/logos/sigom.png" alt="SIGOM"><img src="/assets/logos/dec.png" alt="DEC"></div><h1>Sistema Integrado de Gestão de Obras Militares</h1><p class="subtitle">Acesso remoto seguro</p><form id="loginForm"><label>E-mail ou nome de usuário<input id="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><div id="mfaBox" hidden><h2>Autenticação em dois fatores</h2><div id="enrollBox" hidden><p>Leia o QR Code no Google Authenticator ou Microsoft Authenticator.</p><div id="qr"></div></div><label>Código de 6 dígitos<input id="totp" inputmode="numeric" maxlength="6"></label><button id="verifyBtn" type="button">Validar código</button></div><p id="status" class="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/auth.js"></script></body></html>

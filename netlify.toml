[build]
  publish = "public"

	

[functions]
  directory = "netlify/functions"
  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://vstqinwjlhrrouxvwzpx.supabase.co wss://vstqinwjlhrrouxvwzpx.supabase.co; frame-src 'self'; font-src 'self' data:"
